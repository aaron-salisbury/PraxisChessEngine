name: Build and Test

on:
  push:
    branches:
      - modernize
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/PraxisChessEngine.slnx

      - name: Build
        run: dotnet build src/PraxisChessEngine.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/PraxisChessEngine.slnx --configuration Release --no-build
