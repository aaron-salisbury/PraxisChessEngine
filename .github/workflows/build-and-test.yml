name: Build and Test

on:
  push:
    branches:
      - modernize
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/PraxisChessEngine.slnx

      - name: Build
        run: dotnet build src/PraxisChessEngine.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/PraxisChessEngine.slnx --configuration Release --no-build

  uci-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Cute Chess build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build qt6-base-dev qt6-svg-dev qt6-5compat-dev

      - name: Run UCI smoke test
        run: bash build/smoke-test.sh
