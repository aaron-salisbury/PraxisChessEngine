name: Build and Test

on:
  push:
    branches:
      - modernize
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/PraxisChessEngine.slnx

      - name: Build
        run: dotnet build src/PraxisChessEngine.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/PraxisChessEngine.slnx --configuration Release --no-build

  uci-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish Praxis
        run: dotnet publish src/PraxisChessEngine.CLIApp/PraxisChessEngine.CLIApp.csproj --configuration Release --output artifacts/praxis

      - name: Build Cute Chess CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build qt6-base-dev qt6-svg-dev qt6-5compat-dev
          git clone --branch v1.5.1 --depth 1 https://github.com/cutechess/cutechess.git "$RUNNER_TEMP/cutechess"
          cmake -S "$RUNNER_TEMP/cutechess" -B "$RUNNER_TEMP/cutechess/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/cutechess/build" --target cutechess-cli

      - name: Run UCI self-play smoke test
        run: |
          mkdir -p artifacts/smoke
          CUTECHESS_CLI="$(find "$RUNNER_TEMP/cutechess/build" -type f -name cutechess-cli -perm -111 | head -n 1)"
          test -n "$CUTECHESS_CLI"
          "$CUTECHESS_CLI" \
            -engine name=PraxisWhite cmd="$GITHUB_WORKSPACE/artifacts/praxis/PraxisChessEngine" proto=uci \
            -engine name=PraxisBlack cmd="$GITHUB_WORKSPACE/artifacts/praxis/PraxisChessEngine" proto=uci \
            -each tc=10+0.1 \
            -rounds 2 \
            -repeat \
            -recover \
            -pgnout artifacts/smoke/praxis-smoke.pgn
